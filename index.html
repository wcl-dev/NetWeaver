<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NetWeaver v2 — 台灣 FIMI 行為者記錄簿</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121723;
    --panel-2: #1a2130;
    --panel-3: #222b3d;
    --border: #283044;
    --border-soft: #1f2738;
    --text: #e2e8f3;
    --muted: #8a93a6;
    --muted-2: #636d82;
    --attacker: #f0594f;
    --collaborator: #e0a52b;
    --amplifier: #5b9bf5;
    --accent: #3fb6a8;
    --accent-dim: #2c7d74;
    --accent-soft: #16302e;
    --label: #a8b2c4;          /* 小字標籤：對比 ≥4.5 */
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---- layout ---- */
  header.site {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11,14,20,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1180px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .logo {
    font-family: var(--mono); font-weight: 700; letter-spacing: 1px;
    color: var(--accent); font-size: 17px;
  }
  .brand .sub { color: var(--muted); font-size: 12.5px; }
  nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav.tabs a {
    color: var(--muted); padding: 6px 13px; border-radius: 7px;
    font-size: 14px; transition: background .15s, color .15s;
  }
  nav.tabs a:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
  nav.tabs a.active { background: var(--panel-3); color: var(--text); }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: .3px; }
  .page-head p.lead { color: var(--muted); margin: 0; font-size: 14.5px; max-width: 760px; }

  .stat-strip { display: flex; gap: 26px; margin: 16px 0 0; flex-wrap: wrap; }
  .stat-strip .s { display: flex; align-items: baseline; gap: 7px; }
  .stat-strip .s b { font-family: var(--mono); font-size: 20px; color: var(--text); }
  .stat-strip .s span { color: var(--muted); font-size: 12.5px; }

  /* ---- filter bar ---- */
  .filters {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    margin: 22px 0 18px; padding: 14px; background: var(--panel);
    border: 1px solid var(--border-soft); border-radius: var(--radius);
  }
  .filters input[type=search], .filters select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 8px 11px; font-size: 13.5px; font-family: var(--sans);
  }
  .filters input[type=search] { min-width: 210px; flex: 1 1 210px; }
  .filters input[type=search]::placeholder { color: var(--muted-2); }
  .role-chips { display: flex; gap: 6px; }
  .role-chips button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 7px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
    font-family: var(--sans); transition: all .12s;
  }
  .role-chips button:hover { color: var(--text); }
  .role-chips button.on { color: #0b0e14; font-weight: 600; border-color: transparent; }
  .role-chips button.on[data-role=all] { background: var(--accent); }
  .role-chips button.on[data-role=attacker] { background: var(--attacker); }
  .role-chips button.on[data-role=collaborator] { background: var(--collaborator); }
  .role-chips button.on[data-role=amplifier] { background: var(--amplifier); }
  .filters .count { margin-left: auto; color: var(--muted); font-size: 13px; font-family: var(--mono); }

  /* ---- cards grid ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: border-color .15s, transform .12s, background .15s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--muted-2);
  }
  .card.role-attacker::before { background: var(--attacker); }
  .card.role-collaborator::before { background: var(--collaborator); }
  .card.role-amplifier::before { background: var(--amplifier); }
  .card:hover { border-color: var(--accent-dim); transform: translateY(-2px); background: var(--panel-2); }
  .card .c-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .card .name-zh { font-size: 16.5px; font-weight: 600; margin: 0 0 1px; }
  .card .name-en { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .card .summary { font-size: 13px; color: #c2cad8; margin: 9px 0 12px; min-height: 38px; }
  .card .c-bottom { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  .card .c-bottom .m { display: flex; align-items: center; gap: 4px; font-family: var(--mono); }

  /* ---- badges / pills ---- */
  .pill {
    font-size: 11.5px; padding: 2px 9px; border-radius: 20px; font-weight: 500;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .pill.cat { background: var(--panel-2); }
  .role-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .role-dot.attacker { background: var(--attacker); }
  .role-dot.collaborator { background: var(--collaborator); }
  .role-dot.amplifier { background: var(--amplifier); }
  .pill.role { color: #0b0e14; border: none; font-weight: 600; }
  .pill.role.attacker { background: var(--attacker); }
  .pill.role.collaborator { background: var(--collaborator); }
  .pill.role.amplifier { background: var(--amplifier); }
  .conf { font-family: var(--mono); font-size: 11px; }
  .conf .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
  .conf.high .dot { background: var(--accent); }
  .conf.medium .dot { background: var(--collaborator); }
  .conf.low .dot { background: var(--muted-2); }
  .pill.sens { background: #3a2e15; color: var(--collaborator); border-color: #5a4520; }
  .filters .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .filters .toggle input { accent-color: var(--collaborator); }

  /* ---- dossier (entity detail) ---- */
  .back { display: inline-block; margin-bottom: 18px; color: var(--muted); font-size: 13.5px; }
  .dossier-head {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; margin-bottom: 22px; position: relative; overflow: hidden;
  }
  .dossier-head::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; }
  .dossier-head.role-attacker::before { background: var(--attacker); }
  .dossier-head.role-collaborator::before { background: var(--collaborator); }
  .dossier-head.role-amplifier::before { background: var(--amplifier); }
  .dossier-head .file-meta {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted-2);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
  }
  .dossier-head h1 { margin: 0 0 3px; font-size: 27px; }
  .dossier-head .name-en { color: var(--muted); font-family: var(--mono); font-size: 14px; }
  .dossier-head .aliases { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .dossier-head .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  .section { margin-bottom: 26px; }
  .section h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
    border-bottom: 1px solid var(--border-soft); padding-bottom: 8px; margin: 0 0 14px;
  }
  .section p.body { margin: 0 0 8px; color: #cfd6e3; font-size: 14.5px; }

  .ind-list { list-style: none; padding: 0; margin: 0; }
  .ind-list li {
    background: var(--panel); border: 1px solid var(--border-soft); border-left: 3px solid var(--accent-dim);
    padding: 9px 13px; margin-bottom: 7px; border-radius: 6px; font-size: 13.5px; color: #cdd5e2;
  }

  .link-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px;
    cursor: pointer; transition: border-color .12s, background .12s;
  }
  .link-row:hover { border-color: var(--accent-dim); background: var(--panel-2); }
  .link-row .lr-main { flex: 1; min-width: 0; }
  .link-row .lr-title { font-weight: 600; font-size: 14.5px; }
  .link-row .lr-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .link-row .lr-date { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .rel-label { font-family: var(--mono); font-size: 11.5px; color: var(--accent); white-space: nowrap; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 13px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .chip:hover { border-color: var(--accent-dim); }
  .chip .role-dot { width: 8px; height: 8px; }
  .narr-chip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 11px; font-size: 13px; color: #cdd5e2; }

  .src-list { list-style: none; padding: 0; margin: 0; }
  .src-list li { padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; }
  .src-list li:last-child { border-bottom: none; }
  .src-list .org { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  /* ---- v2: 來源 chips (B-lite) ---- */
  .src-basis { margin: 12px 0 2px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .src-basis .lbl { font-size: 11px; color: var(--muted-2); font-family: var(--mono); text-transform: uppercase; letter-spacing: .5px; }
  .src-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 12px; color: #cdd5e2; text-decoration: none; }
  .src-chip:hover { border-color: var(--accent-dim); color: var(--text); text-decoration: none; }
  .src-chip .src-org { color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
  /* ---- v2: operator 分組 / roll-up ---- */
  .op-block { margin-bottom: 12px; }
  .op-block .op-lbl { font-size: 12px; color: var(--muted); margin: 0 0 7px; display: flex; align-items: center; gap: 7px; }
  .op-block.primary .op-lbl { color: var(--attacker); font-weight: 600; }
  .rollup-chain { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 400; }
  .brand .v2 { font-family: var(--mono); font-size: 10px; color: #0b0e14; background: var(--accent); border-radius: 4px; padding: 1px 6px; margin-left: 4px; }
  /* ---- v2.1: claim 卡（真 B，按來源分組）---- */
  /* ---- v2.2: 來源與宣稱合併（一份報告一塊）---- */
  .src-block { border: 1px solid var(--border-soft); border-radius: 8px; margin-bottom: 10px; background: var(--panel); }
  .src-block[open] { border-color: var(--border); }
  .src-sum { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; flex-wrap: wrap;
    align-items: center; gap: 4px 10px; font-size: 13.5px; min-height: 44px; }
  .src-sum::-webkit-details-marker { display: none; }
  .src-sum::before { content: "\25B8"; color: var(--muted-2); margin-right: 2px; font-size: 11px; }
  .src-block[open] .src-sum::before { content: "\25BE"; }
  .src-sum .src-org { font-family: var(--mono); color: var(--accent-dim); }
  .src-sum .src-ttl { color: #cdd5e2; flex: 1 1 260px; }
  .src-sum .rep-date { font-family: var(--mono); font-size: 12px; color: var(--label); }
  .src-sum .src-n { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 10px; }
  .src-sum .src-n.has { color: var(--accent); background: var(--accent-soft); }
  .src-sum .src-n.none { color: var(--label); border: 1px solid var(--border); }
  .src-body { padding: 2px 14px 12px; }
  .src-body .claim { margin-left: 0; }
  .src-link { margin-top: 8px; font-size: 12.5px; }
  /* 「展開其餘 N 條」：文字鈕外觀，和報告卡片、共現細框各自可辨 */
  details.more > summary { list-style: none; cursor: pointer; display: flex; align-items: center;
    min-height: 44px; font-size: 13px; color: var(--accent);
    border-top: 1px dashed var(--border-soft); margin-top: 6px; padding-top: 8px; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "\FF0B "; }
  details.more[open] > summary::before { content: "\FF0D "; }
  .src-empty { border: 1px dashed var(--border); border-radius: 8px; margin-top: 10px; }
  .src-empty > summary { cursor: pointer; padding: 0 14px; min-height: 44px; display: flex; align-items: center;
    font-size: 13px; color: var(--label); }
  /* ---- 引文共現 ---- */
  .qco { border: 1px solid var(--border-soft); border-radius: 8px; margin-bottom: 8px; background: transparent; }
  .qco > summary { list-style: none; cursor: pointer; padding: 10px 14px; min-height: 44px;
    display: flex; justify-content: space-between; align-items: center; }
  .qco > summary::-webkit-details-marker { display: none; }
  .qco > summary::before { content: "\25B8"; color: var(--muted-2); margin-right: 8px; font-size: 11px; }
  .qco[open] > summary::before { content: "\25BE"; }
  .qco-name { color: #dfe6f0; font-size: 14px; flex: 1; }
  .qco-n { font-family: var(--mono); font-size: 11.5px; color: var(--label); }
  .qco-body { padding: 0 14px 12px; }
  .qco-quote { border-left: 2px solid var(--accent-dim); padding: 8px 12px; margin-bottom: 8px;
    font-size: 13.5px; color: #dfe6f0; line-height: 1.55; background: var(--panel); border-radius: 0 6px 6px 0; }
  .qco-src { margin-top: 5px; font-family: var(--mono); font-size: 11.5px; color: var(--label); }
  .claim { background: var(--panel); border: 1px solid var(--border-soft); border-left: 3px solid var(--accent); padding: 10px 14px; margin: 0 0 7px 12px; border-radius: 6px; font-size: 14px; color: #dfe6f0; line-height: 1.55; }
  /* 敘述角色：邊條顏色分層，證據份量重的在上、顏色實 */
  .claim.k-member { border-left-color: var(--accent-dim); }
  .claim.k-cite   { border-left-color: var(--muted-2); }
  .claim.k-method { border-left-color: var(--border); color: #aeb8c6; }
  .claim-kind { display: inline-block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    color: var(--muted); border: 1px solid var(--border-soft); border-radius: 3px;
    padding: 1px 6px; margin-right: 8px; vertical-align: 1.5px; white-space: nowrap; cursor: help; }
  .claim.k-desc .claim-kind { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
  /* 鍵盤焦點：摺疊控制與連結都要看得見焦點 */
  summary:focus-visible, a:focus-visible, button:focus-visible, .link-row:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  /* 區塊標題原本小於內文，層級反了 */
  .section h2 { font-size: 17px; letter-spacing: .04em; color: var(--text); }

  /* ---- network ---- */
  .net-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  #net-svg { display: block; width: 100%; height: 600px; background:
    radial-gradient(circle at 50% 40%, #131a28 0%, #0b0e14 75%); cursor: grab; }
  #net-svg.grabbing { cursor: grabbing; }
  .net-edge.q { stroke: #3ecf8e; stroke-opacity: .42; stroke-width: 1.2; stroke-dasharray: 2 3; }
  .net-legend { display: flex; gap: 20px; flex-wrap: wrap; padding: 13px 16px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
  .net-legend .lg { display: flex; align-items: center; gap: 7px; }
  .net-node-label { font-size: 11px; fill: var(--text); font-family: var(--sans); pointer-events: none; }
  .net-edge { stroke: #3a455c; stroke-opacity: .55; }
  .net-edge.co { stroke-dasharray: 3 3; stroke-opacity: .3; }
  .net-node { cursor: pointer; }
  .net-node:hover circle { stroke: #fff; stroke-width: 2px; }

  /* ---- about ---- */
  .prose { max-width: 760px; }
  .prose p { color: #cfd6e3; font-size: 14.5px; }
  .callout {
    background: var(--panel); border: 1px solid var(--collaborator); border-left: 4px solid var(--collaborator);
    border-radius: 8px; padding: 14px 16px; margin: 18px 0; font-size: 13.5px; color: #d7c79c;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 40px; text-align: center; }
  footer.site { border-top: 1px solid var(--border); color: var(--muted-2); font-size: 12px; }
  footer.site .fin { max-width: 1180px; margin: 0 auto; padding: 20px; }

  @media (max-width: 620px) {
    .stat-strip { gap: 16px; }
    nav.tabs { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="nav-inner">
    <div class="brand">
      <span class="logo">NetWeaver</span>
      <span class="sub">台灣 FIMI 行為者記錄簿</span><span class="v2">v2 · operator 視圖</span>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/gallery" data-tab="gallery">記錄簿</a>
      <a href="#/events" data-tab="events">事件</a>
      <a href="#/about" data-tab="about">關於</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site">
  <div class="fin">
    NetWeaver · 概念驗證 (PoC) · 資料整理自公開研究報告，記錄「在公開 FIMI 研究中被點名的行為者」，不構成法律指控或定罪。每筆均附來源，歡迎查證。 · <a href="#/network">關聯網絡（實驗）</a>
  </div>
</footer>

<script>
"use strict";
function bootNetWeaver() {
  const DB = window.NETWEAVER_DB;

  // ---- lookups ----
  const byId = (arr) => Object.fromEntries((arr || []).map(x => [x.id, x]));
  const E = byId(DB.entities), EV = byId(DB.events), SRC = byId(DB.sources), NARR = byId(DB.narratives);

  // ---- label maps ----
  const CAT = {
    "state-organ": "國家機關", "tech-vendor": "技術供應商", "pr-firm": "公關公司",
    "content-farm": "內容農場", "cib-network": "協同造假網絡", "state-media": "官方媒體",
    "domestic-amplifier": "在地放大者", "commentator": "評論者", "other": "其他"
  };
  const ROLE = { attacker: "攻擊者", collaborator: "協力者", amplifier: "放大者" };
  const ORIGIN = { PRC: "中國", TW: "台灣", HK: "香港", other: "其他" };
  const CONF = { high: "高", medium: "中", low: "低" };
  const REL = {
    "operated-by": "受其操作", "runs": "操作", "supplies-tech-to": "供應技術給",
    "affiliated-with": "關聯於", "amplifies": "放大", "subsidiary-of": "隸屬於", "linked-to": "連結至"
  };
  const EVTYPE = {
    "election-op": "選舉作戰", "narrative-campaign": "敘事戰役", "platform-takedown": "平台下架",
    "exercise-linked": "軍演伴隨", "exposure": "揭露", "incident": "事件"
  };

  // ---- helpers ----
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const app = document.getElementById("app");

  function confBadge(c) {
    return `<span class="conf ${esc(c)}" title="證據強度／爭議程度"><span class="dot"></span>信心 ${esc(CONF[c] || c || "?")}</span>`;
  }
  function rolePill(r) { return `<span class="pill role ${esc(r)}">${esc(ROLE[r] || r)}</span>`; }
  function catPill(c) { return `<span class="pill cat">${esc(CAT[c] || c)}</span>`; }
  const shortOrg = o => { o = String(o||"").replace(/\s*[（(].*$/,"").trim(); return o.length > 16 ? o.slice(0,16)+"…" : o; };
  function srcChips(ids) {
    const ss = (ids||[]).map(i => SRC[i]).filter(Boolean);
    if (!ss.length) return "";
    return `<div class="src-basis"><span class="lbl">本檔依據</span>${ss.map(s =>
      `<a class="src-chip" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">${esc(shortOrg(s.org))} <span class="src-org">${esc(s.date||"")}</span></a>`).join("")}</div>`;
  }
  // 布林全文比對：空白=AND、" OR "=OR、前綴 - 或 NOT=排除
  function matchBoolean(hay, query) {
    const q = query.toLowerCase().replace(/\bnot\s+/g, "-");
    return q.split(/\s+or\s+/).map(g => g.trim()).filter(Boolean).some(group =>
      group.split(/\s+/).filter(Boolean).every(t =>
        t.startsWith("-") ? (t.length < 2 || !hay.includes(t.slice(1))) : hay.includes(t)));
  }
  // 宣稱的敘述角色（呈現層判斷，不改資料）：記錄簿要「完整呈現被提到的每一處」，
  // 但四種提及方式的證據份量不同，混在一起讀者無從分辨。標記依據是結構性訊號——
  // 引述詞、頓號相鄰、研究流程動詞——不是關鍵字猜測。
  const CLAIM_KIND = {
    cite:   { label: "引為消息來源", hint: "此處是被當成事實來源引述，非被記錄的行為" },
    method: { label: "研究說明",     hint: "描述研究流程本身，非該行為者的行為" },
    member: { label: "列為網絡成員", hint: "在報告的行動者清單中被列名" },
    desc:   { label: "描述其行為",   hint: "報告直接描述此行為者的作為" },
  };
  const KIND_ORDER = ["desc", "member", "cite", "method"];
  function reEsc(s) { return (s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function claimKind(text, about) {
    const n = reEsc(about || ""); if (!n) return "desc";
    if (new RegExp(`(據|根據|引述|援引|轉述|According to|according to)[^。]{0,12}${n}`).test(text)) return "cite";
    if (/(研究團隊|本研究|本次)[^。]{0,24}(將|方法是|收集|排除|比對|接下來|補充)/.test(text)) return "method";
    if (new RegExp(`[、,]\\s*${n}|${n}\\s*[、]|(如|包括|包含|例如)[^。]{0,24}${n}`).test(text)) return "member";
    return "desc";
  }

  // 真 B：claims 按來源分組（來源＋報告發布日只顯示一次，底下列該來源的各條 distinct claim）
  // 名稱→實體索引。CJK 用子字串；純 ASCII 名（TAO/CAC/MPS…）要求詞界，否則 TAOYUAN 會誤中 TAO。
  let _NAMEIDX = null;
  function nameIndex() {
    if (_NAMEIDX) return _NAMEIDX;
    const rows = [];
    DB.entities.forEach(e => [e.name_zh, e.name_en, ...(e.aliases||[])].forEach(nm => {
      if (!nm || nm.length < 2) return;
      rows.push(/^[\x00-\x7F]+$/.test(nm)
        ? { id: e.id, re: new RegExp("(^|[^A-Za-z0-9])" + nm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^A-Za-z0-9])", "i") }
        : { id: e.id, sub: nm });
    }));
    return (_NAMEIDX = rows);
  }
  // 一段文字裡點名到哪些實體。回傳 id 集合——同一實體被多個別名命中只算一次。
  // 同一句常同時掛在多個實體的 claims 上，結果按文字快取。
  const _HITS = new Map();
  function nameHits(text) {
    let hit = _HITS.get(text);
    if (hit) return hit;
    hit = new Set();
    nameIndex().forEach(r => { if (r.sub ? text.includes(r.sub) : r.re.test(text)) hit.add(r.id); });
    _HITS.set(text, hit);
    return hit;
  }
  // 來源 URL 一律限於 http(s)——來源是自動化流程寫進來的，escape 擋得住屬性跳脫但擋不住 javascript:
  function safeUrl(u) { const t = String(u || "").trim(); return /^https?:\/\//i.test(t) ? t : ""; }

  // 一份來源一塊：標題列＋可展開的宣稱。超過 3 條時預設只露 3 條。
  function renderSrcBlock(b) {
    const s = b.s, n = b.cs.length;
    const rows = b.cs.map(c => ({ c, k: claimKind(c.text, c.about) }))
                     .sort((x, y) => KIND_ORDER.indexOf(x.k) - KIND_ORDER.indexOf(y.k));
    const card = r => `<div class="claim k-${r.k}"><span class="claim-kind" title="${esc(CLAIM_KIND[r.k].hint)}">${esc(CLAIM_KIND[r.k].label)}</span>${esc(r.c.text)}</div>`;
    const u = safeUrl(s.url);
    const link = u ? `<div class="src-link"><a href="${esc(u)}" target="_blank" rel="noopener">看原始報告 \u2197</a></div>` : "";
    return `<details class="src-block"${n?" open":""}>
      <summary class="src-sum">
        <span class="src-org">\u3014${esc(shortOrg(s.org))}\u3015</span>
        <span class="src-ttl">${esc(s.title)}</span>
        <span class="rep-date">${esc(s.date||"\u2014")}</span>
        <span class="src-n ${n?"has":"none"}">${n?n+" 條宣稱":"尚無擷取宣稱"}</span>
      </summary>
      <div class="src-body">
        ${n?rows.slice(0,3).map(card).join(""):`<p class="hint">這份報告引用了此行為者，但尚未從中擷取到宣稱。</p>`}
        ${n>3?`<details class="more"><summary>展開其餘 ${n-3} 條</summary>${rows.slice(3).map(card).join("")}</details>`:""}
        ${link}
      </div></details>`;
  }


  function entityCard(e) {
    const evN = (e.event_ids || []).length;
    return `<div class="card role-${esc(e.role)}" data-href="#/entity/${esc(e.id)}">
      <div class="c-top">${catPill(e.category)} <span class="role-dot ${esc(e.role)}" title="${esc(ROLE[e.role]||"")}"></span>${e.sensitivity==='domestic-named'?'<span class="pill sens" title="在地具名行為者：依公開研究中性收錄，可篩除">在地具名</span>':''}</div>
      <div class="name-zh">${esc(e.name_zh)}</div>
      <div class="name-en">${esc(e.name_en || "")}</div>
      <div class="summary">${esc(e.summary_zh || "")}</div>
      <div class="c-bottom">
        <span class="m" title="現身事件數">⊙ ${evN} 事件</span>
        <span class="m">${esc(ORIGIN[e.origin] || e.origin)}</span>
        ${confBadge(e.confidence)}
      </div>
    </div>`;
  }

  // ===================== GALLERY =====================
  const gState = { q: "", role: "all", cat: "all", origin: "all", hideSensitive: false };

  function renderGallery() {
    setTab("gallery");
    const cats = [...new Set(DB.entities.map(e => e.category))];
    app.innerHTML = `
      <div class="page-head">
        <h1>行為者記錄簿（Actor Registry）</h1>
        <p class="lead">台灣面對的境外資訊操弄 (FIMI) 中，被公開研究記錄的攻擊者與協力者。點任一卡片查看檔案與其現身的事件。</p>
        <div class="stat-strip">
          <div class="s"><b>${DB.entities.length}</b><span>行為者</span></div>
          <div class="s"><b>${DB.events.length}</b><span>事件</span></div>
          <div class="s"><b>${DB.sources.length}</b><span>來源</span></div>
        </div>
      </div>
      <div class="filters">
        <input type="search" id="f-q" placeholder="全文搜尋（空白=AND、OR、-排除）…" value="${esc(gState.q)}" />
        <div class="role-chips" id="f-role">
          ${["all","attacker","collaborator","amplifier"].map(r =>
            `<button data-role="${r}" class="${gState.role===r?"on":""}">${r==="all"?"全部":ROLE[r]}</button>`).join("")}
        </div>
        <select id="f-cat">
          <option value="all">所有類別</option>

        </select>
        <select id="f-origin">
          <option value="all">所有來源地</option>

        </select>
        <label class="toggle"><input type="checkbox" id="f-sens" ${gState.hideSensitive?"checked":""} /> 隱藏在地具名</label>
        <span class="count" id="f-count"></span>
      </div>
      <div class="grid" id="grid"></div>`;

    const draw = () => {
      const q = gState.q.trim().toLowerCase();
      const list = DB.entities.filter(e => {
        if (gState.role !== "all" && e.role !== gState.role) return false;
        if (gState.cat !== "all" && e.category !== gState.cat) return false;
        if (gState.origin !== "all" && e.origin !== gState.origin) return false;
        if (gState.hideSensitive && e.sensitivity === "domestic-named") return false;
        if (gState.q.trim()) {
          const hay = [e.name_zh, e.name_en, ...(e.aliases||[]), e.summary_zh, e.description_zh,
            ...(e.indicators||[]), CAT[e.category], ROLE[e.role], ORIGIN[e.origin]].join(" ").toLowerCase();
          if (!matchBoolean(hay, gState.q)) return false;
        }
        return true;
      });
      document.getElementById("grid").innerHTML = list.length
        ? list.map(entityCard).join("")
        : `<div class="empty">沒有符合條件的行為者。</div>`;
      document.getElementById("f-count").textContent = `${list.length} / ${DB.entities.length}`;
      bindCards();
    };

    document.getElementById("f-q").addEventListener("input", e => { gState.q = e.target.value; draw(); });
    document.getElementById("f-cat").addEventListener("change", e => { gState.cat = e.target.value; draw(); });
    document.getElementById("f-origin").addEventListener("change", e => { gState.origin = e.target.value; draw(); });
    document.getElementById("f-sens").addEventListener("change", e => { gState.hideSensitive = e.target.checked; draw(); });
    document.querySelectorAll("#f-role button").forEach(b =>
      b.addEventListener("click", () => { gState.role = b.dataset.role; renderGallery(); }));
    draw();
  }

  function bindCards() {
    document.querySelectorAll("[data-href]").forEach(el =>
      el.addEventListener("click", () => { location.hash = el.dataset.href; }));

  // ===================== ENTITY DOSSIER =====================
  function renderEntity(id) {
    const e = E[id];
    if (!e) return notFound("找不到此行為者");
    setTab("gallery");

    const events = (e.event_ids || []).map(i => EV[i]).filter(Boolean)
      .sort((a,b) => (b.date||"").localeCompare(a.date||""));
    const isOperator = e.role === 'attacker';
    const ownEv = new Set(events.map(x => x.id));
    const downstream = DB.entities.filter(o => o.id !== e.id && (
      (o.related||[]).some(r => r.target_id === e.id && r.relation === 'operated-by') ||
      (e.related||[]).some(r => r.target_id === o.id && r.relation === 'runs')));
    const rollup = [];
    downstream.forEach(o => (o.event_ids||[]).map(i => EV[i]).filter(Boolean).forEach(ev => {
      if (!ownEv.has(ev.id) && !rollup.some(x => x.ev.id === ev.id)) rollup.push({ ev, via: o });
    }));
    // outgoing + incoming relations
    const outRel = (e.related || []).map(r => ({ ...r, e: E[r.target_id] })).filter(r => r.e);
    const outIds = new Set(outRel.map(r => r.e.id));
    const inRel = DB.entities.flatMap(o => (o.related||[])
      .filter(r => r.target_id === id)
      .map(r => ({ relation: r.relation, note: r.note, e: o, incoming: true })))
      .filter(r => !outIds.has(r.e.id)); // 去除反向重複：若已有去向關係就不再列回向
    const rels = [...outRel, ...inRel];
    // 來源與宣稱合併：人工策展的 source_ids ∪ 宣稱實際引用到的來源。
    // 有宣稱的排前面並預設展開；沒有的仍列出——「引用了此行為者但尚未擷取到宣稱」
    // 本身就是有意義的狀態，藏起來會讓人以為那份報告沒收。
    const byS = {};
    (e.claims||[]).forEach(c => (byS[c.source_id] = byS[c.source_id] || []).push(c));
    const srcBlocks = [...new Set([...(e.source_ids||[]), ...Object.keys(byS)])]
      .map(sid => ({ sid, s: SRC[sid] || { title: "（來源未登錄：" + sid + "）", org: "資料異常", date: "", url: "" }, cs: byS[sid] || [] }))
      .sort((a, b) => b.cs.length - a.cs.length || String(b.s.date||"").localeCompare(String(a.s.date||"")));
    // 引文共現：同一句被引用的原文裡同時點名的其他已登錄實體。
    // 刻意不平鋪事件共現——那是「被點名參與的事件」的冗餘展開。
    const qco = {};
    (e.claims||[]).forEach(c => {
      const hits = nameHits(c.text);
      if (!hits.has(id)) return;      // 本實體沒被這句點名，就不能說「同句共現」
      hits.forEach(oid => {
      if (oid === id || !E[oid]) return;
      const bag = (qco[oid] = qco[oid] || []);
      if (!bag.some(h => h.q === c.text && h.s === c.source_id)) bag.push({ q: c.text, s: c.source_id });
      });
    });
    const qcoRows = Object.entries(qco)
      .filter(([oid]) => !rels.some(r => r.e.id === oid))   // 已有明確關係就不重複列
      .sort((a, b) => b[1].length - a[1].length);

    app.innerHTML = `
      <a class="back" href="#/gallery">← 返回記錄簿</a>
      <div class="dossier-head role-${esc(e.role)}">
        <div class="file-meta">檔案 · ${esc(e.id)} · ${esc(CAT[e.category]||e.category)}</div>
        <h1>${esc(e.name_zh)}</h1>
        <div class="name-en">${esc(e.name_en||"")}</div>
        ${(e.aliases&&e.aliases.length)?`<div class="aliases">別名／代號：${e.aliases.map(esc).join("、")}</div>`:""}
        <div class="badges">
          ${rolePill(e.role)} ${catPill(e.category)}
          <span class="pill">來源地：${esc(ORIGIN[e.origin]||e.origin)}</span>
          ${e.active_since?`<span class="pill">活動起：${esc(e.active_since)}</span>`:""}
          ${confBadge(e.confidence)}
          ${e.sensitivity==='domestic-named'?`<span class="pill sens" title="在地具名行為者：依公開研究中性收錄為某敘事的放大者，非法律指控">在地具名 · 待審</span>`:""}
        </div>
      </div>

      <div class="section">
        <h2>${(e.claims&&e.claims.length)?'彙整概述（NetWeaver Summary）':'檔案說明（Profile）'}</h2>
        <p class="body">${esc(e.description_zh||e.summary_zh||"—")}</p>
        ${(e.claims&&e.claims.length)?'':srcChips(e.source_ids)}
      </div>
      <div class="section">
        <h2>來源與宣稱（Sources &amp; Claims）(${srcBlocks.length})</h2>
        <p class="hint" style="margin:-4px 0 12px">每份報告一塊；展開可看該報告說了什麼。宣稱由機器擷取並標記敘述角色，其餘為人工策展。</p>
        ${srcBlocks.filter(b=>b.cs.length).map(renderSrcBlock).join("")}
        ${(()=>{const emp=srcBlocks.filter(b=>!b.cs.length);return emp.length?`
          <details class="src-empty"><summary>其他已收錄來源（${emp.length}）· 曾提及此行為者，尚未附上對應原文</summary>
            <ul class="src-list" style="padding:4px 14px 12px">${emp.map(b=>`<li>
              ${safeUrl(b.s.url)?`<a href="${esc(safeUrl(b.s.url))}" target="_blank" rel="noopener">${esc(b.s.title)}</a>`:esc(b.s.title)}
              <div class="org">${esc(b.s.org)} \u00b7 ${esc(b.s.date||"")}</div></li>`).join("")}</ul></details>`:""})()}
        ${!srcBlocks.length?`<div class="empty">未標註來源。</div>`:""}
      </div>

      ${(e.indicators&&e.indicators.length)?`<div class="section">
        <h2>證據指標（Indicators）</h2>
        <ul class="ind-list">${e.indicators.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>`:""}

      <div class="section">
        <h2>${isOperator ? '主導／涉入的行動（Operations）' : '被點名參與的事件（Appearances）'} (${events.length})</h2>
        ${events.length?events.map(ev=>`<div class="link-row" data-href="#/event/${esc(ev.id)}">
          <div class="lr-main"><div class="lr-title">${esc(ev.name_zh)}</div>
            <div class="lr-sub">${esc(EVTYPE[ev.type]||ev.type)}${ev.summary_zh?" · "+esc(ev.summary_zh):""}</div></div>
          <div class="lr-date">${esc(ev.date||"")}</div>
        </div>`).join(""):`<div class="empty">尚無記錄的事件。</div>`}
        ${rollup.length?`<div style="margin-top:14px">
          <div class="op-lbl" style="color:var(--muted);margin-bottom:8px">↳ 下游歸屬行動（Roll-up · 經其操作之行為者）</div>
          ${rollup.map(({ev,via})=>`<div class="link-row" data-href="#/event/${esc(ev.id)}">
            <div class="lr-main"><div class="lr-title">${esc(ev.name_zh)} <span class="rollup-chain">← ${esc(via.name_zh)}</span></div>
              <div class="lr-sub">${esc(EVTYPE[ev.type]||ev.type)}${ev.summary_zh?" · "+esc(ev.summary_zh):""}</div></div>
            <div class="lr-date">${esc(ev.date||"")}</div>
          </div>`).join("")}
        </div>`:``}
      </div>

      ${qcoRows.length?`<div class="section">
        <h2>引文共現（Co-mentioned in Quotes）(${qcoRows.length})</h2>
        <p class="hint" style="margin:-4px 0 10px">同一句被引用的原文裡同時點名的行為者。機器從宣稱推得，每條都指得回原句。
        這是<strong>共同被提及</strong>，不是雙方有合作或協調關係——後者須由人工登錄為明確關係。</p>
        ${qcoRows.map(([oid,hits])=>`<details class="qco">
          <summary><span class="qco-name">${esc(E[oid].name_zh)}</span>
            <span class="qco-n">${hits.length} 段原文</span></summary>
          <div class="qco-body">
            ${hits.map(h=>`<div class="qco-quote">\u300c${esc(h.q)}\u300d<div class="qco-src">${SRC[h.s]?esc(shortOrg(SRC[h.s].org))+" \u00b7 "+esc(String(SRC[h.s].title).slice(0,40)):esc(h.s)}</div></div>`).join("")}
            <div class="src-link"><a href="#/entity/${esc(oid)}">前往 ${esc(E[oid].name_zh)} 的檔案 \u2192</a></div>
          </div></details>`).join("")}
      </div>`:""}

      ${rels.length?`<div class="section">
        <h2>關聯實體（Related Entities）(${rels.length})</h2>
        ${rels.map(r=>`<div class="link-row" data-href="#/entity/${esc(r.e.id)}">
          <div class="lr-main"><div class="lr-title">${esc(r.e.name_zh)}</div>
            <div class="lr-sub">${esc(r.note||"")}</div></div>
          <div class="rel-label">${r.incoming?"← ":""}${esc(REL[r.relation]||r.relation)}${r.incoming?"":" →"}</div>
        </div>`).join("")}
      </div>`:""}`;
    bindCards();
  }

  // ===================== EVENT DETAIL =====================
  function renderEvent(id) {
    const ev = EV[id];
    if (!ev) return notFound("找不到此事件");
    setTab("events");
    const parts = (ev.participant_ids||[]).map(i=>E[i]).filter(Boolean);
    const narrs = (ev.narratives||[]).map(n => NARR[n] || { name_zh: n });
    const srcs = (ev.source_ids||[]).map(i=>SRC[i]).filter(Boolean);

    app.innerHTML = `
      <a class="back" href="#/events">← 返回事件清單</a>
      <div class="dossier-head">
        <div class="file-meta">事件 · ${esc(ev.id)} · ${esc(EVTYPE[ev.type]||ev.type)}</div>
        <h1>${esc(ev.name_zh)}</h1>
        <div class="name-en">${esc(ev.name_en||"")}</div>
        <div class="badges">
          <span class="pill">時間：${esc(ev.date||"")}${ev.period?` （${esc(ev.period)}）`:""}</span>
          ${confBadge(ev.confidence)}
        </div>
      </div>

      <div class="section"><h2>事件說明（Summary）</h2><p class="body">${esc(ev.summary_zh||"—")}</p>${srcChips(ev.source_ids)}</div>

      ${narrs.length?`<div class="section"><h2>涉及敘事（Narratives）</h2>
        <div class="chips">${narrs.map(n=>`<span class="narr-chip" title="${esc(n.summary_zh||"")}">${esc(n.name_zh)}</span>`).join("")}</div></div>`:""}

      <div class="section">
        <h2>參與行為者（Actors）(${parts.length})</h2>
        ${(() => {
          const ops = parts.filter(p => p.role === 'attacker');
          const sup = parts.filter(p => p.role !== 'attacker');
          const chip = p => `<span class="chip" data-href="#/entity/${esc(p.id)}"><span class="role-dot ${esc(p.role)}"></span>${esc(p.name_zh)}</span>`;
          let h = "";
          if (ops.length) h += `<div class="op-block primary"><div class="op-lbl"><span class="role-dot attacker"></span>主導者（Operator）</div><div class="chips">${ops.map(chip).join("")}</div></div>`;
          if (sup.length) h += `<div class="op-block"><div class="op-lbl">協力・放大・管道（Supporting）</div><div class="chips">${sup.map(chip).join("")}</div></div>`;
          return h || `<span class="empty">—</span>`;
        })()}
      </div>

      <div class="section"><h2>來源（Sources）(${srcs.length})</h2>
        ${srcs.length?`<ul class="src-list">${srcs.map(s=>`<li>
          <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>
          <div class="org">${esc(s.org)} · ${esc(s.date||"")}</div></li>`).join("")}</ul>`:`<div class="empty">未標註來源。</div>`}
      </div>`;
    bindCards();
  }

  // ===================== NETWORK GRAPH =====================
  function renderNetwork() {
    setTab("network");
    app.innerHTML = `
      <div class="page-head">
        <h1>關聯網絡（Relationship Graph）</h1>
        <p class="lead">節點為行為者（顏色＝角色）。實線為明確關係（操作／供應／關聯…）；灰虛線為共同現身於同一事件；綠虛線為機器抽取的引文共現。
        <strong>同句被提及或同場出現，不等於雙方有合作、協調或組織關係。</strong>可拖曳節點，點擊進入檔案。</p>
      </div>
      <div class="net-wrap">
        <svg id="net-svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="net-legend">
          <span class="lg"><span class="role-dot attacker"></span>攻擊者</span>
          <span class="lg"><span class="role-dot collaborator"></span>協力者</span>
          <span class="lg"><span class="role-dot amplifier"></span>放大者</span>
          <span class="lg"><span style="display:inline-block;width:18px;height:0;border-top:2px solid #3a455c"></span>明確關係</span>
          <span class="lg"><span style="display:inline-block;width:18px;height:0;border-top:2px dashed #3a455c"></span>共同現身（事件）</span>
          <span class="lg"><span style="display:inline-block;width:18px;height:0;border-top:2px dashed #3ecf8e"></span>引文共現（機器抽取）</span>
        </div>
      </div>`;
    buildForceGraph(document.getElementById("net-svg"));
  }

  function buildForceGraph(svg) {
    const W = 900, H = 600;
    const COLOR = { attacker: "#f0594f", collaborator: "#e0a52b", amplifier: "#5b9bf5" };
    const N = DB.entities.length;
    const nodes = DB.entities.map((e, i) => {
      const ang = (i / Math.max(1, N)) * Math.PI * 2;      // 等角度分布於圓周
      const rad = 90 + (i % 3) * 40;                        // 微錯開半徑，避免完全同心
      return {
        id: e.id, name: e.name_zh, role: e.role,
        r: 8 + Math.min(10, (e.event_ids||[]).length * 2.4),
        x: W/2 + Math.cos(ang) * rad,
        y: H/2 + Math.sin(ang) * rad,
        vx: 0, vy: 0, fx: null, fy: null
      };
    });
    const idx = Object.fromEntries(nodes.map((n, i) => [n.id, i]));

    // explicit relations (deduped, undirected)
    // 一組實體只畫一條邊，強者優先：明確關係 > 事件共現 > 引文共現。
    // 順序即強度，先加的贏——否則同一組會疊兩條虛線。
    const edgeSet = new Set(); const edges = [];
    const addEdge = (a, b, kind) => {
      if (a === b || idx[a]==null || idx[b]==null) return;
      const pair = [a, b].sort().join("|");
      if (edgeSet.has(pair)) return;
      edgeSet.add(pair);
      edges.push({ a: idx[a], b: idx[b], co: kind !== "rel", quote: kind === "quote", pair });
    };
    DB.entities.forEach(e => (e.related||[]).forEach(r => addEdge(e.id, r.target_id, "rel")));
    // co-appearance edges
    DB.events.forEach(ev => {
      const p = (ev.participant_ids||[]).filter(x => idx[x]!=null);
      for (let i=0;i<p.length;i++) for (let j=i+1;j<p.length;j++) addEdge(p[i], p[j], "event");
    });
    // 引文共現：同一句被引用的原文裡同時點名兩個已登錄實體 → 一條邊，滑過看得到原句
    const CO_EV = {}, seenQ = new Set();
    DB.entities.forEach(e => (e.claims||[]).forEach(c => {
      const hit = [...nameHits(c.text)].filter(x => idx[x]!=null);
      for (let i=0;i<hit.length;i++) for (let j=i+1;j<hit.length;j++) {
        const k = [hit[i], hit[j]].sort().join("|");
        // 同一句 claim 會掛在多個實體檔案上；按（配對，來源，原文）去重，否則 tooltip 的句數會膨脹
        const once = k + "\u0000" + c.source_id + "\u0000" + c.text;
        if (!seenQ.has(once)) { seenQ.add(once); (CO_EV[k] = CO_EV[k] || []).push({ q: c.text, s: c.source_id }); }
        addEdge(hit[i], hit[j], "quote");
      }
    }));

    const NS = "http://www.w3.org/2000/svg";
    const mk = (t, attrs) => { const el = document.createElementNS(NS, t); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const gEdges = mk("g", {}), gNodes = mk("g", {});
    svg.appendChild(gEdges); svg.appendChild(gNodes);

    const edgeEls = edges.map(e => {
      const l = mk("line", { class: "net-edge" + (e.quote ? " q" : e.co ? " co" : "") });
      if (e.quote && CO_EV[e.pair]) {
        const t = mk("title", {});
        t.textContent = "引文共現（" + CO_EV[e.pair].length + " 句）：\u300c" + CO_EV[e.pair][0].q.slice(0, 70) + "\u300d";
        l.appendChild(t);
      }
      gEdges.appendChild(l); return l;
    });
    const nodeEls = nodes.map(n => {
      const g = mk("g", { class: "net-node" });
      const c = mk("circle", { r: n.r, fill: COLOR[n.role] || "#888", "fill-opacity": .9, stroke: "#0b0e14", "stroke-width": 1.5 });
      const t = mk("text", { class: "net-node-label", "text-anchor": "middle", dy: n.r + 13 });
      t.textContent = n.name;
      g.appendChild(c); g.appendChild(t);
      g.addEventListener("click", () => { if (!g._dragged) location.hash = "#/entity/" + n.id; });
      enableDrag(g, n, svg, W, H);
      gNodes.appendChild(g);
      return g;
    });

    // ---- force simulation (Fruchterman–Reingold-ish) ----
    const k = Math.min(115, Math.sqrt((W * H) / Math.max(1, nodes.length)) * 0.5);
    let alpha = 1, ticks = 0;
    function tick() {
      // repulsion
      for (let i=0;i<nodes.length;i++) {
        for (let j=i+1;j<nodes.length;j++) {
          const a = nodes[i], b = nodes[j];
          let dx = a.x-b.x, dy = a.y-b.y, d = Math.hypot(dx,dy) || 0.01;
          const f = (k*k)/d * 0.5;
          dx/=d; dy/=d;
          a.vx += dx*f*alpha; a.vy += dy*f*alpha;
          b.vx -= dx*f*alpha; b.vy -= dy*f*alpha;
        }
      }
      // attraction along edges
      edges.forEach(e => {
        const a = nodes[e.a], b = nodes[e.b];
        let dx = a.x-b.x, dy = a.y-b.y, d = Math.hypot(dx,dy) || 0.01;
        const f = (d*d)/k * (e.co ? 0.03 : 0.06);
        dx/=d; dy/=d;
        a.vx -= dx*f*alpha; a.vy -= dy*f*alpha;
        b.vx += dx*f*alpha; b.vy += dy*f*alpha;
      });
      // gravity to center + integrate
      nodes.forEach(n => {
        if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; }
        else {
          n.vx += (W/2 - n.x) * 0.03 * alpha;
          n.vy += (H/2 - n.y) * 0.03 * alpha;
          n.vx *= 0.82; n.vy *= 0.82;
          n.x += Math.max(-20, Math.min(20, n.vx));
          n.y += Math.max(-20, Math.min(20, n.vy));
          n.x = Math.max(n.r+4, Math.min(W-n.r-4, n.x));
          n.y = Math.max(n.r+4, Math.min(H-n.r-30, n.y));
        }
      });
      // paint
      edges.forEach((e, i) => { const a = nodes[e.a], b = nodes[e.b];
        edgeEls[i].setAttribute("x1", a.x); edgeEls[i].setAttribute("y1", a.y);
        edgeEls[i].setAttribute("x2", b.x); edgeEls[i].setAttribute("y2", b.y); });
      nodes.forEach((n, i) => nodeEls[i].setAttribute("transform", `translate(${n.x},${n.y})`));

      alpha *= 0.985; ticks++;
      if (alpha > 0.02 && ticks < 600) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    svg._reheat = () => { alpha = Math.max(alpha, 0.5); requestAnimationFrame(tick); };
  }

  function enableDrag(g, n, svg, W, H) {
    let active = false;
    const pt = (ev) => { const r = svg.getBoundingClientRect();
      return { x: (ev.clientX - r.left)/r.width*W, y: (ev.clientY - r.top)/r.height*H }; };
    g.addEventListener("pointerdown", (ev) => {
      active = true; g._dragged = false; g.setPointerCapture(ev.pointerId);
      svg.classList.add("grabbing"); const p = pt(ev); n.fx = p.x; n.fy = p.y; ev.stopPropagation();
    });
    g.addEventListener("pointermove", (ev) => {
      if (!active) return; g._dragged = true; const p = pt(ev); n.fx = p.x; n.fy = p.y;
      if (svg._reheat) svg._reheat();
    });
    const end = (ev) => { if (!active) return; active = false; svg.classList.remove("grabbing");
      n.fx = null; n.fy = null; setTimeout(() => { g._dragged = false; }, 30); };
    g.addEventListener("pointerup", end);
    g.addEventListener("pointercancel", end);
  }

  // ===================== ABOUT =====================
  function renderAbout() {
    setTab("about");
    app.innerHTML = `
      <div class="page-head"><h1>關於 NetWeaver（About）</h1></div>
      <div class="prose">
        <p>NetWeaver 是一個<strong>概念驗證</strong>，把台灣面對的境外資訊操弄與干預（FIMI, Foreign Information Manipulation and Interference）中、<strong>已被公開研究記錄</strong>的攻擊者與協力者，整理成一本可瀏覽的「記錄簿」：每個行為者一張檔案，並標出他現身於哪些事件。靈感來自歐盟 EEAS 的 FIMI 威脅框架與 EUvsDisinfo 資料庫。</p>

        <div class="callout">
          <strong>定位與免責：</strong>本站記錄的是「在公開 FIMI 研究中被點名的行為者」，<strong>不是法律上的指控或定罪</strong>。關係屬描述性（如「共同現身於同一事件」「供應技術」），<strong>未做正式歸因主張</strong>。每筆關鍵內容都附上來源，歡迎自行查證；如有錯誤或爭議，以原始來源為準。
        </div>

        <p><strong>資料來源</strong>主要取自三類公開研究：政府公開報告（如國家安全局 NSB）、公民社會研究機構（如 IORG 台灣資訊環境研究中心、Doublethink Lab 台灣民主實驗室），以及國際平台與研究單位的揭露（如 Meta、Google/Mandiant、Graphika）。</p>

        <p><strong>資料模型</strong>刻意設計成可對映國際標準（STIX 2.1 / DISARM / EEAS DAD-CDM 擴充），目前 v1 停在輕量的「實體—事件—關係」層級，尚未納入 DISARM 戰技標記與曝光層級分級——那是最自然的下一步。結構說明見專案內 <code>docs/SCHEMA.md</code>。</p>

        <p style="color:var(--muted-2);font-size:13px;margin-top:30px">資料版本：${esc((DB.meta&&DB.meta.version)||"—")} · 更新：${esc((DB.meta&&DB.meta.updated)||"—")}</p>
      </div>`;
  }

  // ===================== ROUTER =====================
  function notFound(msg) { app.innerHTML = `<div class="empty">${esc(msg||"找不到頁面")}。<br><a href="#/gallery">返回記錄簿</a></div>`; }
  function setTab(name) {
    document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("active", a.dataset.tab === name));
  }
  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    const [view, arg] = h.split("/");
    window.scrollTo(0, 0);
    switch (view) {
      case "": case "gallery": return renderGallery();
      case "entity": return renderEntity(arg);
      case "events": return renderEvents();
      case "event": return renderEvent(arg);
      case "network": return renderNetwork();
      case "about": return renderAbout();
      default: return notFound();
    }
  }
  window.addEventListener("hashchange", route);
  route();
}

// data/db.js 每次策展發布都會變，但 python -m http.server 與 file:// 都不送
// Cache-Control，瀏覽器就用啟發式快取（依 Last-Modified 的年齡推算新鮮期）
// 判定舊檔還新鮮、不回頭問伺服器——發布完打開看到的是上一版，資料對、畫面錯，
// 最難查的那種。載入時帶時間戳，強制每次取新。
(function () {
  const s = document.createElement("script");
  s.src = "data/db.js?t=" + Date.now();
  s.onload = function () {
    if (!window.NETWEAVER_DB) return s.onerror();
    bootNetWeaver();
  };
  // 載不到就要講出來。原本 `|| { entities: [] }` 的預設值會靜靜渲染出一本
  // 空記錄簿，看起來像「還沒收錄任何行為者」而不是「資料沒載到」。
  s.onerror = function () {
    document.getElementById("app").innerHTML =
      '<div class="empty">載入 data/db.js 失敗——記錄簿沒有資料可顯示。'
      + '請確認伺服器由專案根目錄啟動（python3 serve.py）。</div>';
  };
  document.head.appendChild(s);
})();
</script>
</body>
